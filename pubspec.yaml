name: mnajem
version: 1.0.0+1
publish_to: none
description: A new Flutter project.
environment: 
  sdk: '>=2.19.6 <3.0.0'

dependencies: 
  cupertino_icons: ^1.0.2
  get: 
  flutter: 
    sdk: flutter

dev_dependencies: 
  flutter_lints: 2.0.3
  flutter_test: 
    sdk: flutter

flutter: 
  uses-material-design: true


  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Cairo-Medium.ttf
    - family: Almarai
      fonts:
        - asset: fonts/Almarai-Light.ttf
          weight: 700
    - family: Tajawal
      fonts:
        - asset: fonts/Tajawal-Medium.ttf
          weight: 700
    